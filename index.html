<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EarnTask Bot - Login</title>
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to right, #007bff, #00c6ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-container {
      background: #ffffff;
      padding: 30px 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .logo-container {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .logo-container img {
      max-width: 120px;
      border-radius: 12px;
    }

    .login-box {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #333333;
      font-size: 1.6rem;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .footer {
      margin-top: 15px;
      font-size: 0.85em;
      color: #777;
    }

    .error {
      color: red;
      font-size: 0.9em;
      margin-top: 8px;
    }

    @media (max-width: 400px) {
      .login-box {
        padding: 20px 15px;
      }

      .login-box h2 {
        font-size: 1.4rem;
      }

      input, button {
        font-size: 0.95rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <img src="ChatGPT_Image_Apr_30__2025__03_52_03_PM-removebg-preview.png" alt="EarnTask Bot Logo" />
    </div>
  <div class="login-box">
    <h2>EarnTask Bot Login</h2>
    <form onsubmit="handleLogin(event)">
      <input type="text" id="skype" placeholder="Skype Address" required />
      <input type="password" id="pin" placeholder="Registration PIN" required />
      <button type="submit">Login</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="footer">Secure Login • © 2025 EarnTask Bot</div>
  </div>

  <script>
    const allowedUsers = [
      { skype: "davidishaka@gmail.com", pin: "D381204" },
    
    ];

    function handleLogin(event) {
      event.preventDefault();

      const skype = document.getElementById("skype").value.trim().toLowerCase();
      const pin = document.getElementById("pin").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      const isValid = allowedUsers.some(user =>
        user.skype === skype && user.pin === pin
      );

      if (isValid) {
        window.location.href = "aprilfool.html";
      } else {
        errorMsg.textContent = "Invalid Skype or PIN. Try again!";
      }
    }
  </script>
</body>
</html>
